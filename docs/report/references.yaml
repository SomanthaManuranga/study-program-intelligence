    title: "Vorausberechnung der Studienanfängerinnen und Studienanfänger und der Studierenden 2024 bis 2035"
    collection-title: "Dokumentation Nr. 1"
    URL: https://www.kmk.org/downloads-dokumente/statistik/hochschulstatistik/vorausberechnung-der-studienanfaenger-und-studierendenzahlen-2024-bis-2035.html
