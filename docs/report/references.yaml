# CSL-YAML bibliography for the report (author-year via pandoc --citeproc). Keys are cited as [@key].
# Every entry corresponds to a source in configs/sources.yaml (id in the note field). Accessed dates = retrieval.
references:
  - id: destatis2026students
    type: dataset
    author: [{literal: "Statistisches Bundesamt (Destatis)"}]
    title: "Statistik der Studierenden (21311): Studienanfänger und Studierende nach Fach, Land und Hochschule, 2005-2025"
    publisher: "GENESIS-Online"
    URL: https://genesis.destatis.de/datenbank/online/statistic/21311/details
    issued: {date-parts: [[2026]]}
    accessed: {date-parts: [[2026, 10, 14]]}
    note: "sources.yaml: destatis_genesis_21311"
  - id: destatis2026exams
    type: dataset
    author: [{literal: "Statistisches Bundesamt (Destatis)"}]
    title: "Statistik der Prüfungen (21321): Absolventen nach Fach und Land, 2005-2025"
    publisher: "GENESIS-Online"
    URL: https://genesis.destatis.de/datenbank/online/statistic/21321/details
    issued: {date-parts: [[2026]]}
    accessed: {date-parts: [[2026, 10, 14]]}
    note: "sources.yaml: destatis_genesis_21321"
  - id: ba2026studiensuche
