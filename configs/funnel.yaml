# Data-driven funnel: pre-registered rules (docs/funnel_preregistration.md). Committed before any programme type is
# computed. Do not change after the step that uses a value has run; a later change is logged in docs/decision_log.md
# and the old value is kept as a sensitivity. Version 2: amended after the independent attack, before any result.

universe:
  fit_on: {degrees: [Bachelor/Bakkalaureus, Master], study_form: Vollzeitstudium, country: Deutschland}   # scope 7
  assign_afterwards: other forms of the same degrees and offers left unclustered are assigned to their nearest type without refitting, if within the type's 90th percentile member distance
  counted_as_supply: all assigned offers except Fernstudium (reported separately); variants of one institution and title count once
  dedupe: same institution, title and degree count as one offer

text:
  fields: title without degree words; Schwerpunkte items only; subject labels without the level marker
  dropped: notes of the institution ("Anmerkung der Hochschule"), "Inhalte bitte bei der Hochschule erfragen", "(grundstaendig)", "(weiterfuehrend)"
  encoder: intfloat/multilingual-e5-base
  report: noise share and cluster mix by focus-items-present and by institution type

discovery:
  umap: {n_neighbors: 15, n_components: 10, metric: cosine, min_dist: 0.0, seeds: [42, 43, 44]}
  hdbscan_grid: {min_cluster_size: [10, 15, 20, 30, 50], method: [eom, leaf], min_samples: 5}
  bootstrap: {refits: 10, subsample: 0.8, seed: 20261106}
  stable_jaccard: 0.75       # Hennig (2007): mean best-match Jaccard >= 0.75 counts as stable
  selection: highest share of offers in stable clusters, among settings with noise <= 0.50 and largest cluster <= 0.10 of offers; tie goes to more stable clusters
  unstable_clusters: treated as noise
  rare_path:                 # scope 8; "not yet offered anywhere in Germany" cannot be found by clustering offers: a stated limitation
    source: offers treated as noise
    method: average-linkage agglomerative in the 768-d embedding space on cosine distance
    distance_cutoff: median within-cluster pairwise cosine distance of the stable types
    min_institutions: 2
    max_size: selected min_cluster_size minus 1
    evidence_flag: rare types carry the flag "rare, not stability-tested"
  crosscheck: TF-IDF k-means with the same k; a type whose best TF-IDF match has Jaccard < 0.3 is flagged "method-dependent"
  validation: ARI against the catalogue's study fields; afterwards, how many of the 18 old topic lists are recovered at Jaccard >= 0.5

pool_mapping:                # committed before clustering: configs/funnel_subject_map.csv
  method: every catalogue subject label to one Destatis subject code; exact name, else nearest by the encoder; then checked by a second look
  weights: fractional per offer over its labels; per type, the mean over its offers
  no_unmapped: every label gets a code; matches below the review line are listed

screen:                      # applied to every type x level
  at_oth:
    assign: every OTH offer of any form and any faculty goes to its nearest type
    drop_if: distance of the OTH offer <= the type's median member distance, at the same level
    otherwise: keep the type; that OTH offer is an OTH site in the capture model
  supply_gap: {max_offers_within_100km: 3}    # old G5 number, on a new unit; in the stress grid
  trend:
    measure: log-linear slope of German first-years of the mapped pool in Bavaria, 2019-2024, %/yr
    drop_if_below: -3.0
    only_if: the pool's own backtest MASE < 1; an unvalidated trend cannot drop a type
    master: German graduates of the mapped pool instead of first-years
  emi_domain:
    offer_score: mean over focus items and title of the highest raw e5 cosine to any EMI module, leaving out the programme's own modules
    type_score: mean over the type's offers with focus items; title only if no offer has any
    calibration: positives = EMI offers in the catalogue (configs/oth_portfolio.yaml); negatives = other OTH full-time offers
    bar: Youden cut on the calibration set
    if_auc_below: {auc: 0.8, action: flag instead of drop}

freeze:
  lists: {primary: all screens, stress: only the at_oth screen}   # both carried through steps 4-6 by script
  files: [data/interim/funnel_candidates.csv, data/interim/funnel_candidates_stress.csv]
  hash_recorded_in: docs/funnel_reasoning.md
  rule: nothing enters after the freeze; nothing is added by hand

demand:
  backtest: {origins_from: 2012, horizons: [1, 2, 3, 4, 5], metric: MASE}
  model_choice: lowest pooled MASE among naive, drift, ets; a type's trend counts as validated only if its own MASE < 1
  horizon_year: 2030
  foreign: corridor from flat to compounded, never a point forecast

labour:
  keywords: top 5 c-TF-IDF unigrams and bigrams of each candidate after a stoplist of degree and catalogue words, German and English where the catalogue has both; listed before counting
  regions: [germany, bayern, amberg_100km]
  count: largest single keyword count on one date (no summing); keywords stored with the snapshot

capture:
  model: the Step 47/48 Huff model (analysis/options.py); competitors = offers of the type; nothing by hand
  oth_sites: OTH offers assigned to the type, else the nearest OTH offer of that level, at weight w
  w: {low: 0.25, central: 0.5, high: 1.0}
  anchor:
    bachelor: German first-years of the mapped pool in Bavaria / Bavarian bachelor offers of that pool in all forms, offers counted fractionally
    master: German graduates of the pool in Bavaria x transition 0.5 / Bavarian master offers of that pool; transition is an assumption, stress 0.3 and 0.7
    no_bavarian_offer: Germany-wide mean per offer; flagged
    scale: OTH's Huff attractiveness over the mean of the type's Bavarian sites
    international: reported as a corridor on top, from 0 to the pool's foreign share; not in the central number
    validation: median absolute log error against the published intakes in configs/intake_benchmark_documents.yaml, THI 25 and Deggendorf 60
    if_error_above_log_1_5: multiply by the pre-registered shrink factor (median published / anchor)
  range: {low: 0.5, high: 2.0}   # judgement band
  min_cohort: {value: 20, gate: central steady-state gross below this drops the candidate; low case is reported, sensitivity: [15, 25]}
  primary_outcome: net-new first-years at steady state, unprojected; trend projection is a labelled sensitivity
  known_limits: straight-line distance, Bavarian origins only, no location-attractiveness effect (backlog F3)

shortlist:
  pre_gate_score: weighted score with fit replaced by the emi_domain score and feasibility left out, weights renormalised
  gate_list: automatic F1-F4 down the ranked list until 6 candidates pass (at most 3 per level, kill rule 5) or 20 were tried
  hand_check: only those; a candidate rejected by hand is replaced from the list

feasibility_gate:
  rule: configs/feasibility.yaml unchanged (F1-F4)
  reference_curriculum: HAW offer of the same level nearest the type's centroid with a handbook obtainable under robots.txt; next nearest up to 5 tries; universities only if no HAW offer exists; a second reference is reported where available
  scaling: proportional to 165 / 60 taught ECTS is the primary; the unscaled figure is reported
  hand_check: Soma confirms every module counted as covered; a second person repeats a sample; Cohen's kappa is reported
  caps_for_N_ects: {bachelor: [10, 15, 20], master: [5, 10]}
  default_cap: 10 / 5 until the faculty answers; other rows are labelled conditional

ranking:
  ranked_set: gate-passers only
  weights: configs/analysis.yaml unchanged   # demand .30, labour .20, fit .20, feasibility .15, differentiation .10, regional .05
  value_functions:   # 1-5 scale, piecewise linear between anchors, clipped
    trend_pct_per_year: {-3: 1, 0: 3, 3: 5}
    net_new: {10: 1, 40: 5}
    demand_is: mean of trend and net_new
    labour_ads_within_100km_log: {10: 1, 150: 5}
    fit_F1: {0.60: 1, 1.00: 5}
    feasibility_tightest_margin: {1.0: 1, 0.0: 5}   # max(T / cap, N / cap, F4 / 0.5)
    differentiation_offers_within_150km: {10: 1, 0: 5}
    regional_share_of_net_new_kept_in_region: {0.0: 1, 0.4: 5}
  uncertainty: {weights: Dirichlet concentration 50, draws: 10000, seed: 42, scores: triangular over each input's low / central / high}
  cross_check: PROMETHEE II with the same weights
  disclosed: competition enters three times (screen, Huff, differentiation); trend twice

stress_tests:
  downstream_factorial:
    min_cohort: [15, 20, 25]
    anchor_range: [[0.5, 2.0], [0.33, 3.0]]
    pool_trend: [unprojected, projected, foreign held flat]
    dirichlet_concentration: [10, 50, 200]
    n_cap_bachelor: [10, 15, 20]
  list_changing_one_at_a_time:
    trend_threshold: [-5, off]
    supply_gap_max_offers_within_100km: [2, 5]
    at_oth: any member of the type
    clustering: next best setting; types matched at Jaccard >= 0.5
  report: win share over the factorial with no-winner specs in the denominator; list-changing specs separately; regret table; which missing number would change the winner

decision:
  two_or_more_passers: recommend the top one if P(rank 1) >= 0.5, P(beats the runner-up) >= 0.8 and win share >= 0.5
  one_passer: recommend it if central gross >= the minimum cohort and central net-new >= 15
  no_passer: report that no candidate passes and the smallest new resource for the closest one
  promethee_disagrees_on_rank_1: shortlist instead of a recommendation
  otherwise: report the shortlist and the missing number that would settle it
