# The EMI module behind each adapted-module (E2) verdict of the two candidates that pass the gate, for Soma's hand
# check (docs/handcheck_sheet.md, generated by python -m study_program_intelligence.report.handcheck_sheet).
# Keys are the reference modules in configs/feasibility_handcheck.yaml; emi = (EMI programme id, exact module title as
# in data/interim/modules_emi_2026.csv, without the "[ CODE ]" prefix). Where the verdict names two EMI modules or only
# a format, the closest single module is shown and the note says so.
# if_rejected: what the module would become (T = teaching assignment, N = new module by an existing professor).
# decision: filled in from Soma's answers (confirm / reject); empty = not yet decided.

candidates:
  robotics_b:
    hand_check: robotics_bsc
    reference: hske_ba_rob
    path: B
    modules:
      RO 262 Robotik Projekt 1: {emi: [oth26_ba_ki, Grundlagen der Robotik], if_rejected: N, note: "verdict rests on the project format; robotics content as in this module"}
      RO 31 Wissenschaftliches Arbeiten und statistische Datenanalyse: {emi: [oth26_ba_ii, Data Analytics], if_rejected: N, note: "verdict also names Stochastik (KI)"}
      RO 33 Aktorik: {emi: [oth26_ba_ei, Grundlagen elektrischer Maschinen und Antriebe], if_rejected: N}
      RO 34 Verteilte Softwaresysteme: {emi: [oth26_ba_iki, "Big Data, Cloud & NoSQL"], if_rejected: N}
      RO 36 Robotik Projekt 2: {emi: [oth26_ba_ki, Grundlagen der Robotik], if_rejected: N, note: "project format; same EMI module as RO 262"}
      RO 45 Robotik Projekt 3: {emi: [oth26_ba_ki, Grundlagen der Robotik], if_rejected: N, note: "project format; same EMI module as RO 262"}
      RO 632 Robotik Projekt 4 Teil 1: {emi: [oth26_ba_ki, Grundlagen der Robotik], if_rejected: N, note: "the verdict names only the project format; closest module shown"}
      RO 633 Robotik Projekt 4 Teil 2: {emi: [oth26_ba_ki, Grundlagen der Robotik], if_rejected: N, note: "the verdict names only the project format; closest module shown"}
      RO 71 Ethik und Recht im Kontext der Robotik: {emi: [oth26_ba_ii, Informationsethik und Technikphilosophie], if_rejected: T, note: "law part: no EMI module"}
      RO 6221 Mensch-Maschine-Interaktion: {emi: [oth26_ba_mi, Mensch-Computer-Interaktion], if_rejected: N, note: "verdict also names Mediengestaltung (MI)"}
  arvr:
    hand_check: arvr_bsc
    reference: hsc_ba_vc
    modules:
      Grundlagen des Visual Computing: {emi: [oth26_ba_mt, Visual Computing], if_rejected: N}
      Bildverarbeitung 2: {emi: [oth26_ba_ki, Deep Computer Vision], if_rejected: N}
      Mathematik für Visual Computing: {emi: [oth26_ba_ii, Mathematik 3], if_rejected: N}
      Mensch-Maschine-Interaktion 2: {emi: [oth26_ba_dd, Human Centered Design], if_rejected: N}
      Visual-Computing-Seminar: {emi: [oth26_ba_dd, Medien/UX-UI Projekte], if_rejected: N, note: "seminar format"}
      Englisch (GER B2) 2: {emi: [oth26_ba_iki, Foreign Language 1], if_rejected: T}
      Interdisziplinäre Projektarbeit: {emi: [oth26_ba_ii, Software-Projekt], if_rejected: N, note: "project format"}

# Soma's answers: "<candidate>|<candidate module>": {decision: confirm | reject, reason: "..."}. Rows not listed are
# undecided (the proposed E2 verdict stands until Soma decides).
decisions:
  "robotics_b|RO 31 Wissenschaftliches Arbeiten und statistische Datenanalyse":
    {decision: reject, reason: "Data Analytics is not statistics / scientific writing"}
  "robotics_b|RO 34 Verteilte Softwaresysteme":
    {decision: reject, reason: "cloud is not distributed systems"}
