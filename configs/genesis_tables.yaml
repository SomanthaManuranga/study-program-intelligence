     title: "Studienanfaenger: Bundeslaender (Brandenburg), Semester, Nationalitaet, Geschlecht, Studienfach"}
  - {id: "21311-0015_MV", name: "21311-0015", startyear: 2018, endyear: 2025,
     params: {regionalvariable: DLAND, regionalkey: "13"},
     title: "Studienanfaenger: Bundeslaender (Mecklenburg-Vorpommern), Semester, Nationalitaet, Geschlecht, Studienfach"}
  - {id: "21311-0015_SN", name: "21311-0015", startyear: 2018, endyear: 2025,
     params: {regionalvariable: DLAND, regionalkey: "14"},
     title: "Studienanfaenger: Bundeslaender (Sachsen), Semester, Nationalitaet, Geschlecht, Studienfach"}
  - {id: "21311-0015_ST", name: "21311-0015", startyear: 2018, endyear: 2025,
     params: {regionalvariable: DLAND, regionalkey: "15"},
