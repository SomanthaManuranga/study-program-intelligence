# Queries for the BA Studiensuche (Hochschulkompass data), all of Germany.
# Study fields and their ids come from data/raw/studiensuche/studienfelder.json
# (python -m study_program_intelligence.ingest.studiensuche fields, 14 Oct 2026).
#
# No "uk" parameter: without it the search covers all of Germany (uk=Bundesweit returns HTTP 400, probe 14 Oct 2026).
# Each field is queried twice: st 0 = first degree (bachelor level),
# st 1 = further degree (master level). sfe takes both dkzIds of the field.
# Field choice: everything EMI could plausibly teach, plus neighbouring fields
# (business informatics, mathematics/statistics, industrial engineering) so
# that interdisciplinary competitors are not missed.

queries:
  - {id: informatik_ba, label: "Informatik (first degree)", field_key: "2509", params: {sfe: "94116;93995", st: 0}}
  - {id: informatik_ma, label: "Informatik (further degree)", field_key: "2509", params: {sfe: "94116;93995", st: 1}}
  - {id: wirtschaftsinformatik_ba, label: "Wirtschaftsinformatik (first degree)", field_key: "2928", params: {sfe: "130048;130047", st: 0}}
  - {id: wirtschaftsinformatik_ma, label: "Wirtschaftsinformatik (further degree)", field_key: "2928", params: {sfe: "130048;130047", st: 1}}
  - {id: elektro_informationstechnik_ba, label: "Elektro- und Informationstechnik (first degree)", field_key: "2307", params: {sfe: "93970;93853", st: 0}}
  - {id: elektro_informationstechnik_ma, label: "Elektro- und Informationstechnik (further degree)", field_key: "2307", params: {sfe: "93970;93853", st: 1}}
  - {id: automatisierung_produktion_ba, label: "Automatisierungs-, Produktionstechnik (first degree)", field_key: "2303", params: {sfe: "94030;93598", st: 0}}
  - {id: automatisierung_produktion_ma, label: "Automatisierungs-, Produktionstechnik (further degree)", field_key: "2303", params: {sfe: "94030;93598", st: 1}}
  - {id: energietechnik_ba, label: "Energietechnik, Energiemanagement (first degree)", field_key: "2309", params: {sfe: "94362;94319", st: 0}}
  - {id: energietechnik_ma, label: "Energietechnik, Energiemanagement (further degree)", field_key: "2309", params: {sfe: "94362;94319", st: 1}}
