  - {id: technik_uebergreifend_ma, label: "Technik, Ingenieurwissenschaften (übergreifend) (further degree)", field_key: "2339", params: {sfe: "94307;93592", st: 1}}
  - {id: wirtschaftsingenieurwesen_ba, label: "Wirtschaftsingenieurwesen, Technologiemanagement (first degree)", field_key: "2347", params: {sfe: "93814;93581", st: 0}}
