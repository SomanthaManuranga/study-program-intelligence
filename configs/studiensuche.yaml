  - {id: mechatronik_mikro_opto_ma, label: "Mechatronik, Mikro- und Optotechnik (further degree)", field_key: "2321", params: {sfe: "93896;94237", st: 1}}
  - {id: medizintechnik_ba, label: "Medizintechnik, Technisches Gesundheitswesen (first degree)", field_key: "2325", params: {sfe: "93584;94187", st: 0}}
  - {id: medizintechnik_ma, label: "Medizintechnik, Technisches Gesundheitswesen (further degree)", field_key: "2325", params: {sfe: "93584;94187", st: 1}}
  - {id: medien_veranstaltungstechnik_ba, label: "Medien-, Veranstaltungstechnik (first degree)", field_key: "2323", params: {sfe: "94145;94284", st: 0}}
  - {id: medien_veranstaltungstechnik_ma, label: "Medien-, Veranstaltungstechnik (further degree)", field_key: "2323", params: {sfe: "94145;94284", st: 1}}
  - {id: kommunikation_medien_ba, label: "Kommunikation und Medien (first degree)", field_key: "3517", params: {sfe: "93888;93821", st: 0}}
  - {id: kommunikation_medien_ma, label: "Kommunikation und Medien (further degree)", field_key: "3517", params: {sfe: "93888;93821", st: 1}}
